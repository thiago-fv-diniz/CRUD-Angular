<a routerLink="/users" class="back">← Voltar para a lista</a>

<section class="form-card glass">
  <header class="form-head">
    <h1>Novo usuário</h1>
    <p>Preencha os dados para adicionar alguém à lista.</p>
  </header>

  <form (ngSubmit)="save()" autocomplete="off">
    <label class="field">
      <span>Nome</span>
      <input class="input" name="firstName" placeholder="Ex.: Ana" [(ngModel)]="request.firstName">
    </label>

    <label class="field">
      <span>Sobrenome</span>
      <input class="input" name="lastName" placeholder="Ex.: Souza" [(ngModel)]="request.lastName">
    </label>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="!valid || saving">
        {{ saving ? 'Salvando…' : 'Salvar usuário' }}
      </button>
      <a routerLink="/users" class="btn btn-ghost">Cancelar</a>
    </div>
  </form>
</section>
